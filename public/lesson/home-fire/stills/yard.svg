<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-hidden="true">
<rect width="960" height="540" fill="#071018"/>
<rect x="40" y="40" width="880" height="460" fill="#121c30" stroke="#9aacbf" stroke-width="2"/>
<text x="64" y="88" fill="#f3d19a" font-size="22" font-family="system-ui,sans-serif">Instructional still - outside meeting place, not a live fire</text>
<text x="64" y="160" fill="#f4f0e6" font-size="32" font-family="system-ui,sans-serif">Meet in front of this house</text>
<text x="64" y="220" fill="#c5cdd8" font-size="22" font-family="system-ui,sans-serif">Stay outside. Call 9-1-1. Do not go back in.</text>
<text x="64" y="280" fill="#c5cdd8" font-size="22" font-family="system-ui,sans-serif">Tell the operator if someone is still inside.</text>
<text x="64" y="430" fill="#9aacbf" font-size="18" font-family="system-ui,sans-serif">Source: USFA escape plans and Ready.gov home fires.</text>
</svg>
