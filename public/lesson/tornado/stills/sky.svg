<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-hidden="true">
  <rect width="960" height="540" fill="#071018"/>
  <rect x="40" y="40" width="880" height="460" fill="#121c30" stroke="#9aacbf" stroke-width="2"/>
  <text x="64" y="88" fill="#f3d19a" font-size="22" font-family="system-ui,sans-serif">Instructional still  not a live sky and not a generated tornado video</text>
  <text x="64" y="140" fill="#f4f0e6" font-size="36" font-family="system-ui,sans-serif">Tornado Watch: Be prepared</text>
  <text x="64" y="190" fill="#f4f0e6" font-size="36" font-family="system-ui,sans-serif">Tornado Warning: Take action</text>
  <text x="64" y="250" fill="#c5cdd8" font-size="22" font-family="system-ui,sans-serif">Words name the alert. Color and sound are not the only signals.</text>
  <text x="64" y="310" fill="#c5cdd8" font-size="22" font-family="system-ui,sans-serif">This lessons setting is a sturdy house with a basement.</text>
  <text x="64" y="360" fill="#c5cdd8" font-size="20" font-family="system-ui,sans-serif">Not a mobile home. Not a vehicle. Not hurricane flood footage.</text>
  <text x="64" y="430" fill="#9aacbf" font-size="18" font-family="system-ui,sans-serif">Source: National Weather Service tornado watch and warning definitions.</text>
</svg>
